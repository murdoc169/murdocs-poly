<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murdoc's Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="7" stroke="#edeff1" stroke-width="2.4"/><path d="M8 19V9l6 7 6-7v10" stroke="#edeff1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Murdoc's Poly
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Search markets..." autocomplete="off">
  </label>
  <div class="right">
    <span class="chip-status" id="status"></span>
    <button class="pill blue" id="acct">Account</button>
  </div>
  <div class="winbtns">
    <button data-win="min" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button data-win="max" title="Maximize"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
    <button data-win="close" class="x" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="page" id="page">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <div class="trade" id="trade"></div>
</div>
<script src="app.js"></script>
</body>
</html>
